[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kx-notebook"
version = "0.1.2"
description = "Run q through ordinary IPython and Jupyter kernels with portable KX results"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Daniel A." },
]
keywords = ["ipython", "jupyter", "kdb", "kx", "q"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: IPython",
  "Framework :: Jupyter",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "ipython>=8.12",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
keyring = [
  "keyring>=24",
]
pykx = [
  "pykx>=2.5",
]

[project.scripts]
kx-notebook = "kx_notebook.cli:main"

[project.urls]
Changelog = "https://github.com/dreth/kx-notebook/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dreth/kx-notebook#readme"
Issues = "https://github.com/dreth/kx-notebook/issues"
Repository = "https://github.com/dreth/kx-notebook"

[dependency-groups]
dev = [
  "build>=1.2",
  # 2.22.0 evaluates PEP 604 annotations at import time on Python 3.9.
  "fastjsonschema<2.22; python_version < '3.10'",
  "ipykernel>=6.29",
  "mypy>=1.11",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
  "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kx_notebook"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
files = ["src/kx_notebook"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: integration tests that stay local to the test process",
  "live_q: tests requiring a local q executable",
]

[tool.coverage.run]
branch = true
source = ["kx_notebook"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true
