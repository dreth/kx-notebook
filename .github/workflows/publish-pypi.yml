name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish distributions
    if: >-
      github.event.release.prerelease == false &&
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kx-notebook
    permissions:
      contents: read
      id-token: write # Required for PyPI OIDC trusted publishing.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: false

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, pathlib, tomllib;
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
          expected = 'v' + version;
          raise SystemExit(0 if os.environ['RELEASE_TAG'] == expected else
          f'release tag {os.environ[\"RELEASE_TAG\"]!r} does not match {expected!r}')"
      - run: uv sync --group dev --locked
      - name: Test package before release
        run: uv run pytest
      - run: uv build
      - run: uv run twine check --strict dist/*
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
          print-hash: true
